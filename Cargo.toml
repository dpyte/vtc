[package]
name = "vtc"
version = "0.1.2"
authors = ["Dhruv Patel"]
edition = "2021"
description = "A VTC (Virtual Typed Configuration) parser and runtime"
license = "MIT"
repository = "https://github.com/dpyte/vtc"
readme = "README.md"
keywords = ["configuration", "parser", "runtime"]
categories = ["parsing", "config"]
publish = false

[lib]
name = "vtc"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
nom = { version = "7.1.3" }
anyhow = "1.0.94"
thiserror = "2.0.6"
smallvec = { version = "1.13.2", features = ["const_generics", "const_new"] }
fnv = "1.0.7"

sha2 = { version = "0.10.8", default-features = false, optional = true }
base64 = { version = "0.22.1", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false }
tempfile = "3.14.0"
rand = "0.8.5"

[features]
default = ["std-crypto"]
std-crypto = ["dep:sha2", "dep:base64"]

[[bench]]
name = "vtc_benchmarks"
harness = false
path = "benches/vtc_benchmarks.rs"

[profile.dev]
opt-level = 1
debug-assertions = true
debug = true

[profile.release]
codegen-units = 1
panic = "abort"
opt-level = 'z'
lto = true
strip = true